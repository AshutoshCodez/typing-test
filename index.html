<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random quote generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="containter">
        <h1 class="heading">Typing speed test</h1>

        <div id="qoutedisplay"></div>

        <textarea  id="inputbox" placeholder="Start your typing....." class="input"></textarea>

        <div class="stats">
            <p>Time: <span id="time">0</span></p>
            <p>WPM <span id="wpm">0</span></p>
            <p>Accuracy <span id="accuracy">100</span></p>
        </div>
        <button id="restartbtn" class="restart">Restart</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
